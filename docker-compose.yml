version: '3.8'

services:
  # Production build served with nginx
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    container_name: carbi-react
    restart: unless-stopped

  # Development server with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    container_name: carbi-react-dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true

